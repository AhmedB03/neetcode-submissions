name: internship-tracker

on:
  push:
    paths:
      - 'internship-tracker/**'
      - '.github/workflows/internship-tracker.yml'
  pull_request:
    paths:
      - 'internship-tracker/**'
      - '.github/workflows/internship-tracker.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: internship-tracker

jobs:
  test:
    name: Build and test (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: internship-tracker/build/reports/tests/test

  test-postgres:
    name: Test against real PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs the Flyway migration against real PostgreSQL with ddl-auto=validate, which is what
      # catches drift between the migration and the entity mappings. Docker is present on the
      # GitHub runner, so Testcontainers works here even where it cannot run locally.
      - name: Test with Testcontainers
        run: ./gradlew test -Ptestcontainers --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-postgres
          path: internship-tracker/build/reports/tests/test
