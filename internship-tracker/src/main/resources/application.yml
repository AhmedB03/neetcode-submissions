spring:
  application:
    name: internship-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/internship_tracker}
    username: ${DB_USERNAME:internship}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

tracker:
  ghost:
    # An application with no StatusEvent in this many days is reported as GHOSTED.
    # Derived at read time -- never written to the database.
    threshold-days: 30
  digest:
    horizon-days: 7
  gmail:
    enabled: ${GMAIL_ENABLED:true}
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    refresh-token: ${GMAIL_REFRESH_TOKEN:}
    token-directory: ${GMAIL_TOKEN_DIRECTORY:./.gmail-tokens}
    user-id: ${GMAIL_USER_ID:me}
    lookback-days: ${GMAIL_LOOKBACK_DAYS:90}
    max-results-per-poll: 250
    # Polling is opt-in so the app never reaches out to Gmail unless asked.
    poll:
      enabled: ${GMAIL_POLL_ENABLED:false}
      # Every 15 minutes.
      cron: ${GMAIL_POLL_CRON:0 */15 * * * *}

logging:
  level:
    com.ahmedb.internship: INFO
